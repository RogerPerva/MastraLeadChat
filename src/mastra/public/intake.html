<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Intake de Leads</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, sans-serif;
      background: #0f0f0f;
      color: #e5e5e5;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: #1a1a1a;
      border: 1px solid #2a2a2a;
      border-radius: 12px;
      padding: 36px;
      width: 100%;
      max-width: 560px;
    }

    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; }
    p.subtitle { font-size: 0.875rem; color: #888; margin-bottom: 28px; }

    label {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: #aaa;
      margin-bottom: 6px;
      margin-top: 20px;
    }

    textarea, input[type="email"], input[type="file"] {
      width: 100%;
      background: #111;
      border: 1px solid #333;
      border-radius: 8px;
      color: #e5e5e5;
      font-size: 0.9rem;
      padding: 12px;
      outline: none;
      transition: border-color 0.15s;
    }

    textarea { resize: vertical; min-height: 100px; }
    textarea:focus, input[type="email"]:focus { border-color: #555; }

    input[type="file"] {
      padding: 10px 12px;
      cursor: pointer;
      color: #888;
    }

    input[type="file"]::file-selector-button {
      background: #2a2a2a;
      border: 1px solid #444;
      border-radius: 6px;
      color: #e5e5e5;
      cursor: pointer;
      font-size: 0.8rem;
      padding: 5px 12px;
      margin-right: 12px;
    }

    .hint { font-size: 0.75rem; color: #555; margin-top: 5px; }

    button {
      width: 100%;
      margin-top: 28px;
      padding: 13px;
      background: #e5e5e5;
      color: #0f0f0f;
      font-size: 0.95rem;
      font-weight: 600;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: opacity 0.15s;
    }

    button:disabled { opacity: 0.4; cursor: not-allowed; }
    button:hover:not(:disabled) { opacity: 0.88; }

    #status {
      margin-top: 24px;
      padding: 16px;
      border-radius: 8px;
      font-size: 0.875rem;
      display: none;
    }

    #status.loading { background: #1e2a1e; border: 1px solid #2d4a2d; color: #6fcf97; }
    #status.success { background: #1a2a1a; border: 1px solid #2d5a2d; color: #6fcf97; }
    #status.error   { background: #2a1a1a; border: 1px solid #5a2d2d; color: #eb5757; }

    .result-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .result-item {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 10px 14px;
    }

    .result-label { font-size: 0.7rem; color: #666; margin-bottom: 3px; }
    .result-value { font-size: 1rem; font-weight: 600; }

    .badge {
      display: inline-block;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .badge.qualified    { background: #1a4a1a; color: #6fcf97; }
    .badge.nurture      { background: #3a3a1a; color: #f2c94c; }
    .badge.disqualified { background: #4a1a1a; color: #eb5757; }

    .section-title {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #555;
      margin: 20px 0 10px;
    }

    .reason-box {
      background: #111;
      border: 1px solid #2a2a2a;
      border-radius: 6px;
      padding: 12px 14px;
      font-size: 0.85rem;
      color: #ccc;
      line-height: 1.5;
    }

    .breakdown-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 7px;
      font-size: 0.8rem;
    }
    .breakdown-label { color: #888; width: 80px; flex-shrink: 0; }
    .bar-track {
      flex: 1;
      height: 6px;
      background: #222;
      border-radius: 3px;
      overflow: hidden;
    }
    .bar-fill {
      height: 100%;
      border-radius: 3px;
      background: #6fcf97;
      transition: width 0.4s ease;
    }
    .bar-fill.low  { background: #eb5757; }
    .bar-fill.mid  { background: #f2c94c; }
    .bar-fill.high { background: #6fcf97; }
    .bar-pts { color: #555; width: 30px; text-align: right; flex-shrink: 0; }

    .actions-list {
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .action-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.85rem;
    }
    .action-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .action-dot.ok   { background: #6fcf97; }
    .action-dot.skip { background: #555; }

    .tools-list {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }
    .tool-chip {
      background: #1a1a2e;
      border: 1px solid #2a2a4a;
      border-radius: 4px;
      padding: 3px 9px;
      font-size: 0.75rem;
      color: #7c9cbf;
      font-family: monospace;
    }

    .action-meta {
      font-size: 0.75rem;
      color: #555;
      margin-top: 2px;
    }
    .action-meta code {
      font-family: monospace;
      color: #7c9cbf;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Formulario de Intake Comercial</h1>
    <p class="subtitle">Cuéntanos tu proyecto. La IA lo analizará y calificará automáticamente.</p>

    <label for="email">Correo electrónico *</label>
    <input
      type="email"
      id="email"
      placeholder="nombre@empresa.com"
      autocomplete="email"
      required
    />

    <label for="message">Mensaje *</label>
    <textarea
      id="message"
      placeholder="Hola, soy el director de TI de Empresa ABC. Necesitamos un sistema de nómina para 450 empleados..."
    ></textarea>

    <label for="pdf">Requerimiento en PDF (opcional)</label>
    <input type="file" id="pdf" accept="application/pdf" />
    <p class="hint">Máximo 5 MB. Solo archivos .pdf</p>

    <button id="submitBtn" onclick="submitLead()">Enviar y calificar</button>

    <div id="status"></div>
  </div>

  <script>
    const INTAKE_URL = "/intake";

    function setStatus(type, html) {
      const el = document.getElementById("status");
      el.className = type;
      el.style.display = "block";
      el.innerHTML = html;
    }

    function fileToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          // El resultado es "data:application/pdf;base64,XXXX"
          // Solo nos quedamos con la parte después de la coma
          const base64 = reader.result.split(",")[1];
          resolve(base64);
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function submitLead() {
      const emailInput = document.getElementById("email");
      const email = emailInput.value.trim();
      const message = document.getElementById("message").value.trim();
      const pdfInput = document.getElementById("pdf");
      const btn = document.getElementById("submitBtn");

      if (!email || !emailInput.checkValidity()) {
        setStatus("error", "Ingresa un correo electrónico válido.");
        return;
      }

      if (!message) {
        setStatus("error", "El mensaje es obligatorio.");
        return;
      }

      const pdfFile = pdfInput.files[0];
      if (pdfFile && pdfFile.type !== "application/pdf") {
        setStatus("error", "Solo se permiten archivos PDF.");
        return;
      }

      if (pdfFile && pdfFile.size > 5 * 1024 * 1024) {
        setStatus("error", "El PDF excede el tamaño máximo de 5 MB.");
        return;
      }

      btn.disabled = true;
      setStatus("loading", "Analizando tu solicitud con IA...");

      try {
        const inputData = {
          message: `${message}\n\nCorreo electrónico de contacto: ${email}`,
        };

        if (pdfFile) {
          inputData.pdfBase64 = await fileToBase64(pdfFile);
          inputData.pdfName = pdfFile.name;
        }

        const response = await fetch(INTAKE_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(inputData),
        });
        const output = await response.json();

        if (!response.ok) {
          throw new Error(output.error ?? "No se pudo procesar la solicitud.");
        }

        const statusLabel =
          output.status === "qualified"   ? "Calificado"     :
          output.status === "nurture"     ? "En seguimiento" :
          "No calificado";

        const bd = output.breakdown ?? {};
        const breakdownItems = [
          { label: "Presupuesto", pts: bd.budget   ?? 0, max: 20 },
          { label: "Urgencia",    pts: bd.urgency   ?? 0, max: 20 },
          { label: "Autoridad",   pts: bd.authority ?? 0, max: 20 },
          { label: "Claridad",    pts: bd.clarity   ?? 0, max: 15 },
          { label: "Fit",         pts: bd.fit       ?? 0, max: 25 },
        ];

        const barsHtml = breakdownItems.map(({ label, pts, max }) => {
          const pct = Math.round((pts / max) * 100);
          const cls = pct >= 70 ? "high" : pct >= 40 ? "mid" : "low";
          return `
            <div class="breakdown-bar">
              <span class="breakdown-label">${label}</span>
              <div class="bar-track"><div class="bar-fill ${cls}" style="width:${pct}%"></div></div>
              <span class="bar-pts">${pts}/${max}</span>
            </div>`;
        }).join("");

        const hubspotLabel =
          output.hubspotStatus === "contact_created" ? "Contacto creado en HubSpot"      :
          output.hubspotStatus === "contact_updated" ? "Contacto actualizado en HubSpot"  :
          "Skipped: lead por debajo del umbral (≥75)";
        const hubspotOk = output.hubspotStatus !== "skipped";

        const toolsHtml = (output.toolsUsed ?? [])
          .map(t => `<span class="tool-chip">${t}</span>`)
          .join("");

        setStatus("success", `
          <div style="margin-bottom:4px;font-weight:600;">Análisis del agente completado</div>

          <div class="result-grid" style="margin-top:12px;">
            <div class="result-item">
              <div class="result-label">Score</div>
              <div class="result-value">${output.score} / 100</div>
            </div>
            <div class="result-item">
              <div class="result-label">Estado</div>
              <div class="result-value"><span class="badge ${output.status}">${statusLabel}</span></div>
            </div>
            <div class="result-item" style="grid-column:span 2">
              <div class="result-label">Tipo de lead</div>
              <div class="result-value" style="font-size:0.9rem;">${output.leadType ?? "—"}</div>
            </div>
          </div>

          <div class="section-title">Razonamiento del score</div>
          <div class="reason-box">${output.reason ?? "—"}</div>

          <div class="section-title">Desglose de criterios</div>
          ${barsHtml}

          <div class="section-title">Acciones ejecutadas</div>
          <div class="actions-list">
            <div class="action-item">
              <div class="action-dot ok"></div>
              <div>
                <div>Supabase — Lead saved</div>
                <div class="action-meta">Table: <code>leads</code> &nbsp;·&nbsp; ID: <code>${output.leadId}</code></div>
              </div>
            </div>
            <div class="action-item">
              <div class="action-dot ${hubspotOk ? "ok" : "skip"}"></div>
              <div>
                <div>HubSpot — ${hubspotLabel}</div>
                ${hubspotOk ? `<div class="action-meta">Contact ID: <code>${output.hubspotContactId ?? "—"}</code></div>` : ""}
              </div>
            </div>
          </div>

          <div class="section-title">Tools ejecutadas</div>
          <div class="tools-list">${toolsHtml}</div>

        `);
      } catch (err) {
        setStatus("error", "Error: " + err.message);
      } finally {
        btn.disabled = false;
      }
    }
  </script>
</body>
</html>
